services:
  subtitle-translator:
    build: .
    container_name: subtitle-translator
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DATABASE_URL: "${DATABASE_URL:-}"
      # An explicitly blank REDIS_URL disables caching. Unset uses this stack's Redis.
      REDIS_URL: "${REDIS_URL-redis://redis:6379/0}"
      REDIS_CACHE_TTL: "${REDIS_CACHE_TTL:-60}"
      REDIS_KEY_PREFIX: "${REDIS_KEY_PREFIX:-subtitle-translator}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}"
      API_KEY_ENCRYPTION_KEY: "${API_KEY_ENCRYPTION_KEY:-}"
      JWT_COOKIE_SECURE: "${JWT_COOKIE_SECURE:-0}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      REGISTRATION_ENABLED: "${REGISTRATION_ENABLED:-1}"
      CAPTCHA_PROVIDER: "${CAPTCHA_PROVIDER:-none}"
      CAPTCHA_HOSTNAME: "${CAPTCHA_HOSTNAME:-}"
      CAPTCHA_ON_LOGIN: "${CAPTCHA_ON_LOGIN:-1}"
      CAPTCHA_ON_REGISTER: "${CAPTCHA_ON_REGISTER:-1}"
      CAPTCHA_ON_UPLOAD: "${CAPTCHA_ON_UPLOAD:-1}"
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
      RECAPTCHA_SITE_KEY: "${RECAPTCHA_SITE_KEY:-}"
      RECAPTCHA_SECRET_KEY: "${RECAPTCHA_SECRET_KEY:-}"
      HCAPTCHA_SITE_KEY: "${HCAPTCHA_SITE_KEY:-}"
      HCAPTCHA_SECRET_KEY: "${HCAPTCHA_SECRET_KEY:-}"
      # Backward-compatible one-time bootstrap; prefer ADMIN_PASSWORD.
      APP_PASSWORD: "${APP_PASSWORD:-}"
      FLASK_DEBUG: "${FLASK_DEBUG:-0}"
      JOB_WORKERS: "${JOB_WORKERS:-2}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-200}"
      # Keys may be bootstrapped here, but the Settings screen is preferred.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEEPL_API_KEY: "${DEEPL_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
    volumes:
      - subtitle_data:/app/data
    networks:
      - default
      - cache

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    # Cache only: no published port or persistent data volume.
    tmpfs:
      - /data
    networks:
      - cache

networks:
  default:
  cache:
    internal: true

volumes:
  subtitle_data:
